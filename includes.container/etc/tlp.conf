# --- CPU Frequency Limits ---

# Leave minimums at 0 so the CPU can still idle or scale up normally
CPU_SCALING_MIN_FREQ_ON_AC=0
CPU_SCALING_MIN_FREQ_ON_BAT=0

# Leave AC uncapped, but hard-cap battery to 1.1GHz (1100000 kHz)
CPU_SCALING_MAX_FREQ_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_BAT=1100000

# --- Safety Net Configurations ---

# Use balance_power instead of pure "power" to ensure snappy scaling under 1.1GHz
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Keep scaling governor on powersave so it scales dynamically below 1.1GHz
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Disable turbo on battery to guarantee it never spikes past your limit
CPU_BOOST_ON_BAT=0
  
