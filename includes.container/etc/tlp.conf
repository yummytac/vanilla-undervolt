# ------------------------------------------------------------------------------
# /etc/tlp.conf - Optimized Power Management Configuration for Intel m3-8100Y
# Target Profile: Strict 5W/6W Limits, Max 1.1GHz, Aggressive Power Saving
# ------------------------------------------------------------------------------

# --- General System Settings ---
TLP_ENABLE=1
TLP_PERSISTENT_DEFAULT=0

# --- Operation Mode Parameters ---
# Use battery settings even on AC to aggressively enforce power caps
OPERATION_MODE_ON_AC=BAT
OPERATION_MODE_ON_BAT=BAT

# --- File System and Disk Power Management ---
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# --- Platform Profile ---
# Enforce low-power hardware platform profile natively supported by the SOC
PLATFORM_PROFILE_ON_AC=low-power
PLATFORM_PROFILE_ON_BAT=low-power

# --- Processor Performance and Scaling ---
# Force passive scaling driver mode to tightly regulate performance steps
CPU_DRIVER_OPMODE_ON_AC=passive
CPU_DRIVER_OPMODE_ON_BAT=passive

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Cap the CPU frequency strictly to 1.1GHz (1100000 kHz) to reduce thermal output
CPU_SCALING_MIN_FREQ_ON_AC=400000
CPU_SCALING_MAX_FREQ_ON_AC=1100000
CPU_SCALING_MIN_FREQ_ON_BAT=400000
CPU_SCALING_MAX_FREQ_ON_BAT=1100000

# Prevent the processor from boosting all the way to its 2.7GHz/3.4GHz thresholds
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1

# Hardware Energy Performance Hints (Aggressive energy policy registers)
CPU_ENERGY_PERF_POLICY_ON_AC=power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# --- Intel Graphics (i915) Tuning ---
# Restrict integrated GPU frequencies for lower package power draw
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=600
INTEL_GPU_MAX_FREQ_ON_BAT=600
INTEL_GPU_BOOST_FREQ_ON_AC=600
INTEL_GPU_BOOST_FREQ_ON_BAT=600

# --- Hardware and Thermal Management ---
# Keep everything consistently cool and prioritize passive dissipation
PCIE_ASPM_ON_AC=powersupersave
PCIE_ASPM_ON_BAT=powersupersave

# Enable intensive audio and peripheral link power management
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# USB Autosuspend
USB_AUTOSUSPEND=1
