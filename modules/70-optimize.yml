name: install-prefs
type: shell
commands:
          # Prevent Debian packages from starting daemons inside the builder container
          - echo '#!/bin/sh' > /usr/sbin/policy-rc.d
          - echo 'exit 101' >> /usr/sbin/policy-rc.d
          - chmod +x /usr/sbin/policy-rc.d
          
          # Proceed safely with the non-interactive installation
          - DEBIAN_FRONTEND=noninteractive apt-get install -y tlp tlp-rdw powertop micro fish
          
          # Clean up the policy bypass layer after the packages finish setting up
          - rm -f /usr/sbin/policy-rc.d
