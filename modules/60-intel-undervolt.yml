name: install-undervolt
type: shell
commands:
  - apt-get update
  - apt-get install -y build-essential git pkg-config
  - git clone https://github.com/kitsunyan/intel-undervolt.git /tmp/intel-undervolt
  - cd /tmp/intel-undervolt && ./configure && make && make install
  - rm -rf /tmp/intel-undervolt
  - printf "enable yes\n\nundervolt 0 CPU -80\nundervolt 1 GPU -60\nundervolt 2 CPU Cache -80\n" > /etc/intel-undervolt.conf
  - mkdir -p /etc/systemd/system/multi-user.target.wants
  - ln -sf /usr/local/lib/systemd/system/intel-undervolt.service /etc/systemd/system/multi-user.target.wants/intel-undervolt.service
